services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_user
      - backend_book
      - backend_loan
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  backend_user:
    image: saimon4u/user:latest
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URI=mongodb://mongodb:27017/user
      - LOAN_BACKEND_BASE_URI=http://backend_loan:3003
    depends_on:
      - mongodb
    networks:
      - library-net
    deploy:
      mode: replicated
      replicas: 4

  backend_book:
    image: saimon4u/book:latest
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URI=mongodb://mongodb:27017/book
      - LOAN_BACKEND_BASE_URI=http://backend_loan:3003
    depends_on:
      - mongodb
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 4

  backend_loan:
    image: saimon4u/loan:latest
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URI=mongodb://mongodb:27017/loan
      - BOOK_BACKEND_BASE_URI=http://backend_book:3002
      - USER_BACKEND_BASE_URI=http://backend_user:3001
    depends_on:
      - mongodb
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 4

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - lib_data:/data/db
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 1

volumes:
  lib_data:
    driver: local

networks:
  library-net:
    driver: overlay
