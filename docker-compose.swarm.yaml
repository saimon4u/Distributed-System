services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_user
      - backend_book
      - backend_loan
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  backend_user:
    image: saimon4u/user:latest
    environment:
      - DATABASE_URI=mongodb://mongodb_user:27017/phase2
      - LOAN_BACKEND_BASE_URI=http://backend_loan:3003
    depends_on:
      - mongodb_user
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1

  backend_book:
    image: saimon4u/book:latest
    environment:
      - DATABASE_URI=mongodb://mongodb_book:27017/phase2
      - LOAN_BACKEND_BASE_URI=http://backend_loan:3003
    depends_on:
      - mongodb_book
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1

  backend_loan:
    image: saimon4u/loan:latest
    environment:
      - DATABASE_URI=mongodb://mongodb_loan:27017/phase2
      - BOOK_BACKEND_BASE_URI=http://backend_book:3002
      - USER_BACKEND_BASE_URI=http://backend_user:3001
    depends_on:
      - mongodb_loan
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1

  mongodb_user:
    image: mongo:latest
    volumes:
      - user_data:/data/db
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 1

  mongodb_book:
    image: mongo:latest
    volumes:
      - book_data:/data/db
    networks: 
      - library-net
    deploy:
      mode: replicated
      replicas: 1

  mongodb_loan:
    image: mongo:latest
    volumes:
      - loan_data:/data/db
    networks:
      - library-net
    deploy:
      mode: replicated
      replicas: 1

volumes:
  user_data:
    driver: local
  book_data:
    driver: local
  loan_data:
    driver: local

networks:
  library-net:
    driver: overlay
